<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milia System Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="milia-icon">🎀</span> Milia System Dashboard</h1>
            <div id="status-badge" class="badge online">System Online</div>
        </header>

        <main class="grid">
            <section class="card cpu-card">
                <h2>CPU Usage</h2>
                <div class="value" id="cpu-value">0%</div>
                <canvas id="cpu-chart"></canvas>
            </section>

            <section class="card ram-card">
                <h2>RAM Usage</h2>
                <div class="value" id="ram-value">0%</div>
                <div class="progress-bar">
                    <div id="ram-progress" class="progress" style="width: 0%"></div>
                </div>
            </section>

            <section class="card logs-card">
                <h2>System Logs</h2>
                <div id="logs" class="logs-container">
                    <div class="log-entry">[System] Milia Dashboard Initialized.</div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Milia AI Project | Powering Onii-chan's PC</p>
        </footer>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
