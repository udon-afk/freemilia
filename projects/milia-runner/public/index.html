<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milia Runner - Cyber Sprint</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="score-board">SCORE: <span id="score">0</span></div>
            <div id="start-screen">
                <h1 class="title">MILIA RUNNER</h1>
                <p class="subtitle">CYBER SPRINT 2026</p>
                <div class="instructions">
                    <p>[SPACE] or [CLICK] to JUMP</p>
                    <p>Avoid the Obstacles!</p>
                </div>
                <button id="start-button">START SPRINT</button>
            </div>
            <div id="game-over-screen" class="hidden">
                <h2 class="game-over-title">GAME OVER</h2>
                <p class="final-score">FINAL SCORE: <span id="final-score">0</span></p>
                <button id="restart-button">RETRY</button>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
